<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/pages/inquiry.css?v=20260305c">
    <title>Inquiry | UBIQUE KOREA</title>
</head>

<body data-page="inquiry">
    <div id="header-container"></div>

    <main class="subpage-content">
        <!-- s: section 1 -->
        <section class="cont1" data-header-tone="light" aria-labelledby="cont1-title">
            <canvas class="dot-bg" id="inquiryDotBg" aria-hidden="true"></canvas>
            <div class="container">
                <h1 class="title" id="cont1-title"><span class="typing" dataword="Let's Build the Future."></span><span class="cursor" aria-hidden="true">|</span></h1>
                <p class="lead reveal-up">가장 앞선 감각으로 당신의 비즈니스를 내일로 연결합니다.</p>
                <p class="desc reveal-up">프로젝트에 대해 궁금하신 점이 있으시다면 문의를 남겨주세요.</p>
            </div>
        </section>

        <!-- s: section 2 -->
        <section class="cont2" aria-label="Inquiry Form">
            <div class="container">
                <form class="form" id="inquiryForm" action="#" novalidate>
                    <p class="note"><span>*</span>는 필수 입력사항입니다.</p>

                    <div class="grid">
                        <div class="field">
                            <label class="label" for="inqname">
                                <span>성함</span>
                                <b>*</b>
                            </label>
                            <input class="input" id="inqname" type="text" name="name" autocomplete="name" placeholder="성함을 입력해주세요." required aria-describedby="inqnamemsg">
                            <p class="msg" id="inqnamemsg" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label class="label" for="inqmail">
                                <span>이메일</span>
                                <b>*</b>
                            </label>
                            <input class="input" id="inqmail" type="email" name="email" autocomplete="email" placeholder="이메일을 입력해주세요." required aria-describedby="inqmailmsg">
                            <p class="msg" id="inqmailmsg" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label class="label" for="inqorg">
                                <span>기관 또는 기업명</span>
                                <b>*</b>
                            </label>
                            <input class="input" id="inqorg" type="text" name="org" autocomplete="organization" placeholder="기관 또는 기업명 입력해주세요." required aria-describedby="inqorgmsg">
                            <p class="msg" id="inqorgmsg" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label class="label" for="inqtel">
                                <span>연락처</span>
                                <b>*</b>
                            </label>
                            <input class="input" id="inqtel" type="tel" name="tel" autocomplete="tel" placeholder="연락처를 입력해주세요." required aria-describedby="inqtelmsg">
                            <p class="msg" id="inqtelmsg" aria-live="polite"></p>
                        </div>
                    </div>

                    <div class="field full">
                        <label class="label" for="inqmsg">
                            <span>문의내용</span>
                            <b>*</b>
                        </label>
                        <textarea class="texta" id="inqmsg" name="msg" rows="6" placeholder="내용을 입력해주세요." required aria-describedby="inqmsgmsg"></textarea>
                        <p class="msg" id="inqmsgmsg" aria-live="polite"></p>
                    </div>

                    <div class="agree">
                        <div class="check">
                            <input id="inqagree" type="checkbox" name="agree">
                            <button type="button" class="plink privacyopen">개인정보처리방침</button>
                            <label class="txt" for="inqagree">
                                <span>에 동의합니다.</span>
                                <b>*</b>
                            </label>
                        </div>
                        <p class="msg agreemsg" id="inqagreemsg" aria-live="polite"></p>
                    </div>

                    <button class="send" type="submit">
                        <span>Send</span>
                        <i class="arrow" aria-hidden="true"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to Top"></button>

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- gsap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- ScrollTo Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>

    <script src="../assets/js/common.js?v=20260304a"></script>
    <script src="../assets/js/pages/inquiry.js?v=20260305g"></script>
</body>

</html>
